<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JESUS STORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>JESUS STORE</h1>
    <p>PREMIUM DIGITAL PRODUCTS</p>
</header>

<main>
    <section class="hero">
        <h2>Kalitenin Yeni Adresi</h2>
        <p>FiveM ve dijital ürünler için doğru yerdesin.</p>
        <a href="#products">Ürünleri Keşfet</a>
    </section>

    <section id="products">
        <h2>Ürünlerimiz</h2>

        <div class="product">
            <h3>FiveM Tweak</h3>
            <p>Performans ve optimizasyon ürünü.</p>
            <strong>400 TL</strong>
            <button onclick="order('FiveM Tweak', 400)">Satın Al</button>
        </div>
    </section>

    <section id="application">
        <h2>Ekibimize Katıl</h2>
        <p>JESUS STORE ekibinde yer almak ister misin?</p>
        <button onclick="openApplication()">Admin Başvurusu Yap</button>
    </section>
</main>

<footer>
    <p>© 2026 JESUS STORE</p>
</footer>

<script src="script.js"></script>
</body>
</html>
